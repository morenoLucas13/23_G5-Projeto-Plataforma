<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="background">
    <div class="container">
        <div>
            <img src="../Imagens/LogoDoApp.png" class="imagemLogo">
        </div>

        <div class="inputWrapper">
            <h6 class="titulo">Email do usuário:</h6>
            <div class="inputContainer">
                <img src="../Imagens/IconePessoa.png" class="emoji" alt="emojiEmail" />
                <input type="text" class="inputTexto" id="" placeholder="Insira o seu email" />
            </div>
            <div class="divider"></div>
        </div>

        <div class="inputWrapper">
            <h6 class="titulo">Email do usuário:</h6>
            <div class="inputContainer">
                <img src="../Imagens/IconeEmail.png" class="emoji" alt="emojiSenha" />
                <input type="text" class="inputTexto" id="" placeholder="Insira a sua senha" />
            </div>
            <div class="divider"></div>
        </div>

        <div class="inputWrapper">
            <h6 class="titulo">Senha do usuário:</h6>
            <div class="inputContainer">
                <img src="../Imagens/IconeCadeado.png" class="emoji" alt="emojiSenha" />
                <input type="text" class="inputTexto" id="" placeholder="Insira a sua senha" />
            </div>
            <div class="divider"></div>
        </div>

        <div class="inputWrapper">
            <button type="button" class="custom-button" onclick="window.location.href='./home.html';">Cadastrar</button>
        </div>
    </div>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
